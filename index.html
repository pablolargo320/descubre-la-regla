<?xml version="1.0" encoding="UTF-8"?>

<?import javafx.scene.layout.VBox?>
<?import javafx.scene.control.Button?>
<?import javafx.scene.control.Label?>
<?import javafx.geometry.Insets?>

<VBox alignment="CENTER" spacing="14"
      xmlns="http://javafx.com/javafx/8"
      xmlns:fx="http://javafx.com/fxml/1"
      fx:controller="poli.edu.co.controlador.ReglasControlador"
      styleClass="pantalla"
      prefWidth="660" prefHeight="520">

   <children>

      <Label text="Reglas del Juego"
             styleClass="titulo"/>

      <Label text="Objetivo:"
             styleClass="titulo-fase"/>

      <Label text="Descubrir la regla matemática que el sistema usa para transformar números enteros."
             wrapText="true" maxWidth="520"
             styleClass="texto"/>

      <Label text="Fase 1 — Exploración:"
             styleClass="titulo-fase"/>

      <Label text="Ingresa números enteros. El sistema devuelve un resultado según una regla oculta. Prueba cuantos números quieras para analizar el patrón. Cuando creas entender la regla, pasa a la siguiente fase."
             wrapText="true" maxWidth="520"
             styleClass="texto"/>

      <Label text="Fase 2 — Validación:"
             styleClass="titulo-fase"/>

      <Label text="El sistema te dará 4 números. Escribe la salida correcta para cada uno. También puedes escribir la regla directamente si estás seguro."
             wrapText="true" maxWidth="520"
             styleClass="texto"/>

      <Label text="Intentos:"
             styleClass="titulo-fase"/>

      <Label text="Solo tienes 3 intentos. Si los agotas sin acertar, pierdes la partida."
             wrapText="true" maxWidth="520"
             styleClass="msg-error"/>

      <Label text="Victoria: aciertas todas las salidas o escribes la regla correctamente."
             wrapText="true" maxWidth="520"
             styleClass="msg-exito"/>

      <Button text="← Volver al menú"
              onAction="#volverMenu"
              prefWidth="200"
              styleClass="btn-neutro"/>

   </children>

   <padding>
      <Insets top="30" bottom="30" left="70" right="70"/>
   </padding>

</VBox>
