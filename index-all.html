<?xml version="1.0" encoding="UTF-8"?>

<?import javafx.geometry.Insets?>
<?import javafx.scene.control.Button?>
<?import javafx.scene.control.Label?>
<?import javafx.scene.control.Separator?>
<?import javafx.scene.control.TextField?>
<?import javafx.scene.layout.HBox?>
<?import javafx.scene.layout.VBox?>

<VBox alignment="CENTER" spacing="16"
      xmlns="http://javafx.com/javafx/8"
      xmlns:fx="http://javafx.com/fxml/1"
      fx:controller="poli.edu.co.controlador.ResultadoControlador"
      styleClass="pantalla"
      prefWidth="660" prefHeight="520">

   <padding>
      <Insets top="28" bottom="28" left="50" right="50"/>
   </padding>

   <children>

      <!-- TÍTULO -->
      <Label text="Resultado de la Partida"
             styleClass="titulo-resultado"/>

      <!-- GANASTE / PERDISTE (estilo dinámico desde controlador) -->
      <Label fx:id="resultadoLabel"/>

      <!-- TARJETA DE ESTADÍSTICAS -->
      <VBox alignment="CENTER" spacing="8"
            styleClass="card">
         <padding>
            <Insets top="16" bottom="16" left="28" right="28"/>
         </padding>
         <children>
            <Label fx:id="nivelLabel"  styleClass="nivel-info"/>
            <Label fx:id="puntajeLabel" styleClass="puntaje"/>
         </children>
      </VBox>

      <Separator styleClass="separador"/>

      <!-- SECCIÓN REGISTRO -->
      <Label text="¿Deseas guardar tu puntaje?"
             styleClass="texto-hint"/>

      <HBox alignment="CENTER" spacing="10">
         <children>
            <Label text="Nombre:"
                   styleClass="texto"/>
            <TextField fx:id="nombreField"
                       promptText="Ingresa tu nombre"
                       prefWidth="230"
                       styleClass="campo-texto"/>
         </children>
      </HBox>

      <Label fx:id="errorNombreLabel"
             styleClass="msg-error"
             visible="false" managed="false"/>

      <Button fx:id="btnGuardar"
              text="Guardar Puntaje"
              onAction="#guardar"
              prefWidth="190"
              styleClass="btn-accion"/>

      <Label fx:id="confirmacionLabel"
             text="✔  Puntaje guardado exitosamente"
             styleClass="msg-exito"
             visible="false" managed="false"/>

      <Separator styleClass="separador"/>

      <!-- NAVEGACIÓN -->
      <HBox alignment="CENTER" spacing="20">
         <children>
            <Button text="▶  Nueva Partida"
                    onAction="#nuevaPartida"
                    prefWidth="170"
                    styleClass="btn-inicio"/>
            <Button text="← Volver al Menú"
                    onAction="#volverMenu"
                    prefWidth="170"
                    styleClass="btn-neutro"/>
         </children>
      </HBox>

   </children>

</VBox>
